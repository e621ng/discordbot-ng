version: 2

updates:
  - package-ecosystem: npm
    directory: /

    # Schedule updates for Monday.
    schedule:
      interval: weekly
      day: monday

    # See: https://github.com/e621ng/e621ng/blob/504a2afd1d94669ab8d4c1be96e28f905fbfd312/.github/dependabot.yml#L11-L13
    cooldown:
      default-days: 3

    versioning-strategy: increase

    # The lint stack has to move together: eslint majors require matching
    # @eslint/js, @stylistic and typescript-eslint releases.
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@stylistic/*"
          - "typescript-eslint"
          - "globals"

    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no stable JS API yet.
      # typescript-eslint (and thus our lint setup) only supports TS < 6.1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

    # Follow the pull request naming scheme.
    commit-message:
      prefix: "[NPM] "
